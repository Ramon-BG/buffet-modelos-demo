<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">Mesa Viva — site interativo para buffet e eventos</title><desc id="d">Mapa ilustrado da experiência: explorar cardápios, combinar serviços e revisar o pedido. Não é uma captura da interface.</desc><rect width="1200" height="480" rx="16" fill="#233d32"/><text x="64" y="68" fill="#dfbd77" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">PROJETO AUTORAL · UX/UI · FRONTEND</text><text x="60" y="160" fill="#faf6e9" font-family="Georgia,serif" font-size="78">Mesa Viva</text><text x="64" y="208" fill="#e3e5d9" font-family="Arial,sans-serif" font-size="23">Do cardápio ao pedido, com escolhas que acompanham a visita.</text><g font-family="Arial,sans-serif"><rect x="64" y="262" width="312" height="122" rx="8" fill="#f5f1e5"/><text x="88" y="299" fill="#7d6028" font-size="13">01 / EXPLORAR</text><text x="88" y="335" fill="#233d32" font-size="24">Sete cardápios</text><text x="88" y="361" fill="#536254" font-size="15">Consulta e seleção no mesmo contexto</text><path d="M391 323h23m-8-7 8 7-8 7" fill="none" stroke="#dfbd77" stroke-width="2"/><rect x="432" y="262" width="312" height="122" rx="8" fill="#f5f1e5"/><text x="456" y="299" fill="#7d6028" font-size="13">02 / COMBINAR</text><text x="456" y="335" fill="#233d32" font-size="24">Uma única notinha</text><text x="456" y="361" fill="#536254" font-size="15">Escolhas compartilhadas entre as telas</text><path d="M759 323h23m-8-7 8 7-8 7" fill="none" stroke="#dfbd77" stroke-width="2"/><rect x="800" y="262" width="336" height="122" rx="8" fill="#fff1c8"/><text x="824" y="299" fill="#7d6028" font-size="13">03 / REVISAR</text><text x="824" y="335" fill="#233d32" font-size="24">Editar antes de concluir</text><text x="824" y="361" fill="#536254" font-size="15">Pedido rápido ou planejamento guiado</text><text x="64" y="438" fill="#c4cebf" font-size="13">Mapa da experiência · marca fictícia · atendimento simulado</text></g></svg>